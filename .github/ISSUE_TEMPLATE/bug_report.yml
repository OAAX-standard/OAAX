name: Bug report
description: Something in the specification, documentation or example is wrong or does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a bug in a runtime or toolchain, open the issue in that component's repository instead (see CONTRIBUTING.md).
  - type: input
    id: version
    attributes:
      label: OAAX version and component version
      placeholder: "OAAX 2.0, reference-implementation v1.2.3 or commit abc1234"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, CPU architecture and accelerator
      placeholder: "Ubuntu 22.04, arm64, none (CPU)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Toolchain console output and conversion log, or the runtime's error output.
      render: shell
