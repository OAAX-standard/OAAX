name: CI
on:
  pull_request:
  push:
    branches: [main, oaax-2.0]

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the illustrative example
        run: bash example/run-example.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --no-project --with "mkdocs<2" --with mkdocs-material mkdocs build --strict
